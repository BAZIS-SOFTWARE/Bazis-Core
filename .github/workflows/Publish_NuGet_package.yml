name: Publish NuGet package

on:
  push:
    branches:
      - Master_dev

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # ”кажите вашу версию .NET

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release

    - name: Pack
      run: dotnet pack --configuration Release

    - name: Push to NuGet Geometry
      run: dotnet nuget push c:\BazisComponents\IntPackages_v2\Release\Geometry.2.2.1.nupkg --source "https://nuget.pkg.github.com/ONEGOCH/index.json" --api-key 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
    
	- name: Push to NuGet Geometry
      run: dotnet nuget push c:\BazisComponents\IntPackages_v2\Release\OperationalController.3.9.6.nupkg --source "https://nuget.pkg.github.com/ONEGOCH/index.json" --api-key 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
$(PackageId).$(PackageVersion)